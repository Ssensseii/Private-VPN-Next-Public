name: Publish tested Windows release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "GitHub Actions run ID of the Windows build you personally tested"
        required: true
        type: string
      version:
        description: "Release version, for example 0.1.90"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: privatevpn-manual-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish explicitly approved build
    runs-on: windows-latest
    steps:
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^0\\.\\d+\\.\\d+$') { throw 'Version must use x.y.z format' }
          if ('${{ inputs.build_run_id }}' -notmatch '^\\d+$') { throw 'Build run ID must be numeric' }

      - name: Download previously tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: PrivateVPN-Next-Windows-x64
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify release files and checksums
        shell: pwsh
        run: |
          $required = @('PrivateVPN-Next-Setup.exe', 'PrivateVPN-Next-portable.zip', 'SHA256SUMS.txt')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release' $name))) { throw "Missing release file: $name" }
          }
          $lines = Get-Content -LiteralPath 'release/SHA256SUMS.txt'
          foreach ($name in @('PrivateVPN-Next-Setup.exe', 'PrivateVPN-Next-portable.zip')) {
            $line = $lines | Where-Object { $_ -match "^[0-9a-fA-F]{64}\\s+\\*?$([regex]::Escape($name))$" } | Select-Object -First 1
            if (-not $line) { throw "Missing SHA-256 entry for $name" }
            $expected = ($line -split '\\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for $name" }
          }

      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: PrivateVPN Next ${{ inputs.version }}
          prerelease: false
          make_latest: true
          files: |
            release/PrivateVPN-Next-Setup.exe
            release/PrivateVPN-Next-portable.zip
            release/SHA256SUMS.txt
          body: |
            ${{ inputs.release_notes }}

            Published manually after user testing and explicit approval.
